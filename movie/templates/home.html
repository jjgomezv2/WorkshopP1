{% extends 'base.html' %}
{% block content %}

<!-- <h1>Welcome to home page</h1> 
<h1>Welcome to home page, <FONT COLOR = "blue">{{name}}</FONT></h1>
<h2>This is the full home page</h2> -->

<div class = "container">
    <form action="">
        <div class = "mb-3">
            <label for = "searchMovie" class = "form-label">
                Search for Movie: 
            </label>
            <input type = "text" class = "form-control" name = "searchMovie"/>
        </div>
        <button type = "submit" class = "btn btn-primary"> Search </button>
    </form>
    <p>Searching for {{searchTerm}}</p>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for movie in movies %}
        <div v-for="movie in movies" class ="col"> 
            <div class="card" style="width: 18rem;">
                <img src="{{ movie.image.url }}" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title fw-bold">{{movie.title}}</h5>
                    <h6>{{movie.genre}}</h1>
                    <p>{{movie.year}}</p>
                    <p class="card-text">{{movie.description}}</p>

                    {% if movie.url %}
                    <a href = "{{ movie.url }}" class="btn btn-primary">
                        Movie link 
                    </a>
                    {% endif %}
            </div>
        </div>
    </div>
        {% endfor %}
    <br/>
    <br/>
</div>

{% endblock content %}
